# One pull request per dependency, monthly. Grouped updates are not used:
# Dependabot titles a group "bump the <group> group across N directories with
# M updates", which runs past the pr-title check's 60-character subject limit
# and would need renaming by hand (owner's decision, 2026-11-15).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
      include: scope
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
      include: scope
    # Pinned to what Home Assistant Core 2026.7.2 ships (see pyproject.toml).
    # They move with that release, by hand, never on their own.
    ignore:
      - dependency-name: pytest-homeassistant-custom-component
      - dependency-name: hassil
