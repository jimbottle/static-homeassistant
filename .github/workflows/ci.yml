# Raylytics VC Standard, templates/ci/python.yml (STANDARD.md §8, §12).
# Jobs are named exactly pre-commit and test; rulesets/main.json requires
# both by name. hassfest is Home Assistant's own check of the integration's
# manifest and translations. build makes the release zip with scripts/dist.sh,
# the script release.yml runs on a tag, and checks what is in it. HACS's own
# validation is not run yet: it needs the README and the repo's description
# and topics, which arrive with the first release. The pr-title job applies to Tier 1 only;
# scripts/bootstrap-repo.sh removes the block between the tier1-only markers
# for Tier 2. Actions are pinned to full commit SHAs (version in the trailing
# comment), resolved with `gh api` on 2026-10-27.
# A job that runs a matrix reports one check per leg ("test (ubuntu-latest)"),
# which the ruleset does not match: rename it (test-os) and add a plain `test`
# job with `needs: test-os`, `if: always()`, that fails unless
# needs.test-os.result == success (would-you-kindly's ci.yml is the example).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secret scan below reads commits, not the working tree
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        run: uvx pre-commit run --all-files --show-diff-on-failure
      # The gitleaks pre-commit hook scans only the staged index, which is
      # empty on a fresh checkout, so it finds nothing here. This step scans
      # the commits themselves and is the check on a commit made without the
      # local hooks.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      # The same gate contributors run locally: ruff, format, mypy, pytest.
      - run: scripts/verify.sh

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master, 2026-10-26

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the release zip
        run: scripts/dist.sh
      - name: The zip holds the integration and nothing else
        run: |
          zip="$(ls dist/static_radio-*.zip)"
          unzip -Z1 "$zip" | tee names.txt
          if grep -v '^custom_components/static_radio/' names.txt; then
            echo "::error::the zip holds a file outside custom_components/static_radio/"
            exit 1
          fi
          grep -qx 'custom_components/static_radio/manifest.json' names.txt
          python3 -c 'import json; json.load(open("hacs.json"))'

  # tier1-only: begin
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a Conventional Commit subject
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|style|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .{1,60}$'
          if printf '%s\n' "$TITLE" | grep -Eq "$pattern"; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must match $pattern (it becomes the squash commit subject)"
            exit 1
          fi
  # tier1-only: end
