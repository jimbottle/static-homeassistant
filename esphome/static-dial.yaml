# Static Radio dial for the Home Assistant Voice Preview Edition (unofficial).
#
# An ESPHome overlay on the stock Voice PE firmware, release 26.9.0, that lets
# the dial tune Static Radio stations. It is opt-in custom firmware: the
# integration works without it, through voice, the dashboard and the button.
#
# While the "Static dial" switch is on (the integration turns it on while
# Static plays on this speaker), a plain turn fires a dial_clockwise or
# dial_anticlockwise event on the stock "Button press" event entity and a turn
# with the button held steps the volume, as on Static's Chumby port. "Static
# dial: hold to tune" swaps the two. With "Static dial" off, which is how it
# boots, every turn runs the stock firmware's own dial actions, unchanged.
#
# A turn that tunes lights one LED of the ring for the station the dial is on,
# counted from where the volume display starts. The integration keeps the
# place in "Static dial station" (1 for the first station, 0 for none); the
# firmware knows nothing of the stations themselves. A turn that changes the
# volume shows the volume, as it always did, and so does one with the button
# held while "Static dial" is on (the stock ring lights whole under a held
# button).
#
# The stock config is pulled from the tag, and its unpinned voice_kit
# component is pinned to the commit that tag points to. Build it with the
# ESPHome release that built 26.9.0:
#   uvx esphome==2026.6.0 compile esphome/static-dial.yaml
# Wi-Fi comes from esphome/secrets.yaml (see secrets.example.yaml), which is
# never committed. Credit and stations: https://staticradio.app
packages:
  voice_pe:
    url: https://github.com/esphome/home-assistant-voice-pe
    ref: 26.9.0
    files: [home-assistant-voice.yaml]

external_components:
  # Listed after the stock entry, so ESPHome loads voice_kit from here.
  - source:
      type: git
      url: https://github.com/esphome/home-assistant-voice-pe
      ref: 2644f4c794271d735d182ca7ebf899ed46164f4e
    components: [voice_kit]

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

globals:
  # True while the last turn of the dial was one that tunes.
  - id: static_tuning
    type: bool
    restore_value: no
    initial_value: 'false'

number:
  - platform: template
    id: static_dial_station
    name: Static dial station
    icon: mdi:radio-tower
    entity_category: config
    min_value: 0
    max_value: 12
    step: 1
    optimistic: true
    restore_value: false
    initial_value: 0

light:
  - id: !extend voice_assistant_leds
    effects:
      # One LED for the station the dial is on, in the ring's own colour.
      - addressable_lambda:
          name: "Static Station"
          update_interval: 50ms
          lambda: |-
            auto light_color = id(led_ring).current_values;
            Color color(light_color.get_red() * 255, light_color.get_green() * 255,
                  light_color.get_blue() * 255);
            int station = static_cast<int>(id(static_dial_station).state);
            for (uint8_t i = 0; i < 12; i++) {
              it[i] = Color::BLACK;
            }
            if (station >= 1 && station <= 12) {
              it[(6 + station - 1) % 12] = color;
            }

sensor:
  # Drop the stock dial actions, then send every turn through static_dial_turn.
  - id: !extend dial
    on_clockwise: !remove
    on_anticlockwise: !remove
  - id: !extend dial
    on_clockwise:
      - script.execute: {id: static_dial_turn, clockwise: true}
    on_anticlockwise:
      - script.execute: {id: static_dial_turn, clockwise: false}

event:
  - id: !extend button_press_event
    event_types: [dial_clockwise, dial_anticlockwise]

switch:
  - platform: template
    id: static_dial
    name: Static dial
    icon: mdi:radio
    optimistic: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: static_dial_hold_to_tune
    name: "Static dial: hold to tune"
    icon: mdi:gesture-tap-hold
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

script:
  # What the ring shows while the dial is being turned: the station after a
  # turn that tunes, the stock volume display after any other.
  - id: !extend control_leds_dial_touched
    then: !remove
  - id: !extend control_leds_dial_touched
    then:
      - light.turn_on:
          brightness: !lambda return max( id(led_ring).current_values.get_brightness() , 0.2f );
          id: voice_assistant_leds
          effect: !lambda 'return id(static_tuning) ? "Static Station" : "Volume Display";'
  # With the button held the stock ring lights whole, which hides what a held
  # turn did. While "Static dial" is on, a held turn shows what a plain one
  # would: the volume, or the station with hold to tune.
  - id: !extend control_leds_center_button_touched
    then: !remove
  - id: !extend control_leds_center_button_touched
    then:
      - if:
          condition:
            lambda: return id(dial_touched) && id(static_dial).state;
          then:
            - script.execute: control_leds_dial_touched
          else:
            # The stock 26.9.0 action.
            - light.turn_on:
                brightness: !lambda return min ( max( id(led_ring).current_values.get_brightness() , 0.2f ) + 0.1f , 1.0f );
                id: voice_assistant_leds
                effect: "Center Button Touched"
  # Show the station for 3 s after the last click that tunes.
  - id: static_dial_show
    mode: restart
    then:
      - script.execute: control_leds
      - delay: 3s
      - lambda: |-
          id(static_tuning) = false;
          id(dial_touched) = false;
      - script.execute: control_leds
  - id: static_dial_turn
    parameters:
      clockwise: bool
    then:
      - if:
          condition:
            switch.is_on: static_dial
          then:
            - if:
                condition:
                  # Tune on a plain turn, or on a held one with hold to tune.
                  lambda: |-
                    bool held = id(center_button).state || id(disable_buttons).state;
                    return held == id(static_dial_hold_to_tune).state;
                then:
                  - event.trigger:
                      id: button_press_event
                      event_type: !lambda 'return clockwise ? "dial_clockwise" : "dial_anticlockwise";'
                  - sensor.rotary_encoder.set_value: {id: dial, value: 0}
                  - script.stop: control_volume
                  - lambda: |-
                      id(static_tuning) = true;
                      id(dial_touched) = true;
                  - script.execute: static_dial_show
                else:
                  - script.stop: static_dial_show
                  - lambda: |-
                      id(static_tuning) = false;
                      id(dial_touched) = true;
                  - script.execute:
                      id: control_volume
                      increase_volume: !lambda return clockwise;
          else:
            # The stock 26.9.0 dial actions, with the direction as a parameter.
            - script.stop: static_dial_show
            - lambda: |-
                id(static_tuning) = false;
                id(dial_touched) = true;
            - if:
                condition:
                  and:
                    - binary_sensor.is_off: center_button
                    - switch.is_off: disable_buttons
                then:
                  - script.execute:
                      id: control_volume
                      increase_volume: !lambda return clockwise;
                else:
                  - if:
                      condition:
                        media_player.is_playing:
                          id: sendspin_group_media_player
                      then:
                        - script.execute:
                            id: control_group_volume
                            increase_volume: !lambda return clockwise;
                      else:
                        - script.execute:
                            id: control_hue
                            increase_hue: !lambda return clockwise;
