# Development tooling for the repo. The integration itself is not a Python
# package: Home Assistant loads it from custom_components/, and its version
# will live in that folder's manifest.json. The version below exists only
# because uv needs a project table; nothing reads it.
[project]
name = "static-homeassistant"
version = "0.0.0"
description = "Static Radio for Home Assistant (unofficial)"
readme = "README.md"
# Home Assistant Core 2026.7.2, the release this is built against, needs 3.14.2.
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  # Upper bound keeps local runs on the same minor as .pre-commit-config.yaml.
  "ruff>=0.17.3,<0.18",
  "mypy>=1.10",
  "pre-commit>=4.0",
  {include-group = "pure"},
  # The Home Assistant test harness. Each release pins one Home Assistant
  # exactly; 0.13.346 is the one that pins Core 2026.7.2, the release this is
  # built against. Move it only with that release.
  "pytest-homeassistant-custom-component==0.13.346",
]

# All the pure-Python tests need. scripts/verify.sh installs this group alone,
# from the lockfile, to run them with no Home Assistant present.
pure = [
  "pytest>=8.0",
  # Validates the saved schedule fixtures against Static's published schema.
  "jsonschema>=4.20",
  # The sentence matcher Home Assistant Core 2026.7.2 ships, at the version
  # it pins, so the sentence pack is tested against what a listener runs.
  "hassil==3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = [".venv", "spikes"]

[tool.ruff.lint]
preview = false
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "PL", "SIM"]
ignore = [
  "PLR0913",  # too many arguments: Home Assistant integrations often need many
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
# A harness test takes its fixtures as arguments, and some need six.
"tests/ha/**" = ["S101", "S105", "S106", "PLR2004", "PLR0917"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
exclude = [".venv", "spikes"]
# Modules are checked under their real package path,
# custom_components.static_radio.<name>, so no file is ever seen under two names.
explicit_package_bases = true
mypy_path = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The Home Assistant harness has async fixtures that every test gets.
asyncio_mode = "auto"
